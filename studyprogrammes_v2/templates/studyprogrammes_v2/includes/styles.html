<!-- Custom CSS Styles -->
<style>
/* Force override Tailwind CSS for form inputs */
input[type="text"], 
textarea, 
input[type="number"],
select {
  border: 2px solid #9ca3af !important;
  border-radius: 0.5rem !important;
  padding: 0.5rem !important;
  transition: all 0.2s ease-in-out !important;
}

input[type="text"]:focus,
textarea:focus,
input[type="number"]:focus,
select:focus {
  border-color: #3b82f6 !important;
  box-shadow: 0 0 0 1px #3b82f6 !important;
  outline: none !important;
}

/* Hide number input spinners/increment buttons */
.student-count-input::-webkit-outer-spin-button,
.student-count-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.student-count-input[type=number] {
  -moz-appearance: textfield;
  appearance: textfield;
}

/* Override global input styles for student count inputs */
input[type="text"].student-count-input {
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
  border-radius: 0 !important;
}

input[type="text"].student-count-input:focus {
  border: none !important;
  box-shadow: none !important;
  outline: none !important;
  border-color: transparent !important;
}

/* Custom button styling */
.btn-add {
  background-color: #10b981;
  color: white;
  padding: 0.25rem 0.75rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.2s;
  border: none;
  cursor: pointer;
}

.btn-add:hover {
  background-color: #059669;
}

.btn-remove {
  background-color: #ef4444;
  color: white;
  padding: 0.25rem 0.75rem;
  border-radius: 0.375rem;
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.2s;
  border: none;
  cursor: pointer;
}

.btn-remove:hover {
  background-color: #dc2626;
}

/* Drag and Drop Styling */
.module-item {
  cursor: grab;
  transition: all 0.2s ease;
}

.module-item:active {
  cursor: grabbing;
}

.module-item.dragging {
  opacity: 0.5;
  transform: rotate(2deg);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
}

.module-item.drag-target {
  background-color: #f3f4f6;
  border-color: #3b82f6;
  transform: scale(1.02);
}

.module-item.drag-over-top {
  border-top: 3px solid #3b82f6;
  box-shadow: 0 -2px 8px rgba(59, 130, 246, 0.3);
}

.module-item.drag-over-bottom {
  border-bottom: 3px solid #3b82f6;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}

.drag-placeholder {
  height: 4px;
  background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  border-radius: 2px;
  margin: 4px 0;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.drag-placeholder.active {
  opacity: 1;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.drag-handle {
  cursor: grab;
  transition: background-color 0.2s ease;
}

.drag-handle:hover {
  background-color: #f3f4f6;
}

.drag-handle:active {
  cursor: grabbing;
}
</style>
