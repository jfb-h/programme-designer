<!-- JavaScript Functions -->
<script>
// Detailed view toggle functionality  
function toggleDetailedView() {
  const content = document.getElementById('detailed-view');
  const chevron = document.getElementById('detailed-view-chevron');
  
  if (content.classList.contains('hidden')) {
    content.classList.remove('hidden');
    chevron.style.transform = 'rotate(180deg)';
  } else {
    content.classList.add('hidden');
    chevron.style.transform = 'rotate(0deg)';
  }
}

// Module tray toggle functionality
function toggleModuleTray(moduleId) {
  const tray = document.getElementById(`module-tray-${moduleId}`);
  const chevron = document.querySelector(`.module-chevron-${moduleId}`);
  
  if (tray.classList.contains('hidden')) {
    tray.classList.remove('hidden');
    chevron.style.transform = 'rotate(180deg)';
  } else {
    tray.classList.add('hidden');
    chevron.style.transform = 'rotate(0deg)';
  }
}

function openCreateModuleModal() {
  document.getElementById('createModuleModal').classList.remove('hidden');
  setupCourseSearch();
  
  // Apply default filter to show only "Meine Kurse"
  filterCourses();
  
  // Initialize with one certificate group
  const container = document.getElementById('create-certificate-groups');
  if (container && container.children.length === 0) {
    groupCounter = 0; // Reset counter
    addCertificateGroup('create');
  }
}

function closeCreateModuleModal() {
  document.getElementById('createModuleModal').classList.add('hidden');
  resetCourseSelection();
  resetCertificateFields();
  
  // Clear certificate groups
  const container = document.getElementById('create-certificate-groups');
  if (container) {
    container.innerHTML = '';
  }
}

function resetCertificateFields() {
  // Reset create modal certificate fields
  const commentField = document.getElementById('certificate_comment');
  if (commentField) {
    commentField.value = '';
  }
  
  const orRadio = document.querySelector('[name="logic_operator"][value="or"]');
  if (orRadio) {
    orRadio.checked = true;
  }
  
  // Reset searchable select
  clearSelectedCertificateOptions('create');
  
  const searchField = document.getElementById('create-cert-search');
  if (searchField) {
    searchField.value = '';
  }
  
}

function openEditModuleModal(moduleId) {
  const button = document.querySelector(`.edit-module-btn[data-module-id="${moduleId}"]`);
  const moduleName = button.getAttribute('data-module-name');
  const moduleDescription = button.getAttribute('data-module-description');
  const moduleQualificationGoals = button.getAttribute('data-module-qualification-goals');
  const moduleResponsiblePerson = button.getAttribute('data-module-responsible-person') || '';
  const moduleCourses = button.getAttribute('data-module-courses').split(',').filter(id => id !== '');
  const courseSemesters = button.getAttribute('data-course-semesters').split(',').filter(item => item !== '');
  
  // New certificate system fields
  const certificateOptions = button.getAttribute('data-certificate-options').split(',').filter(id => id !== '');
  const logicOperator = button.getAttribute('data-logic-operator') || 'or';
  const certificateComment = button.getAttribute('data-certificate-comment') || '';
  const isGradedStr = button.getAttribute('data-is-graded');
  const isGraded = isGradedStr === 'true' || isGradedStr === 'True';
  
  // Get group structure
  const groupStructureStr = button.getAttribute('data-group-structure') || '{}';
  let groupStructure = {};
  try {
    // Convert Python dict format to valid JSON
    const validJsonStr = groupStructureStr.replace(/'/g, '"');
    groupStructure = JSON.parse(validJsonStr);
  } catch (e) {
    groupStructure = {};
  }
  
  // Populate the form
  document.getElementById('edit_module_id').value = moduleId;
  document.getElementById('edit_module_name').value = moduleName;
  document.getElementById('edit_module_description').value = moduleDescription;
  document.getElementById('edit_module_qualification_goals').value = moduleQualificationGoals || '';
  document.getElementById('edit_module_responsible_person').value = moduleResponsiblePerson;
  
  // Populate certificate fields
  const certCommentField = document.getElementById('edit_certificate_comment');
  if (certCommentField) {
    certCommentField.value = certificateComment;
  }
  
  // Set graded checkbox
  const gradedCheckbox = document.getElementById('edit_is_graded');
  if (gradedCheckbox) {
    gradedCheckbox.checked = isGraded;
  }
  
  
  // Set logic operator
  const logicAndRadio = document.getElementById('edit_logic_and');
  const logicOrRadio = document.getElementById('edit_logic_or');
  
  if (logicOperator === 'and' && logicAndRadio) {
    logicAndRadio.checked = true;
  } else if (logicOrRadio) {
    logicOrRadio.checked = true;
  }
  
  // Clear all certificate option checkboxes first
  document.querySelectorAll('[name="certificate_options"]').forEach(checkbox => {
    if (checkbox.id.startsWith('edit_cert_option_')) {
      checkbox.checked = false;
    }
  });
  
  // Certificate groups will be initialized later in the function
  
  // Clear all checkboxes and semester inputs first
  document.querySelectorAll('#editModuleModal .edit-course-checkbox').forEach(checkbox => {
    checkbox.checked = false;
  });
  document.querySelectorAll('#editModuleModal .semester-input').forEach(input => {
    input.value = '';
    input.style.borderColor = '#d1d5db';
    input.removeAttribute('title');
  });
  
  // Parse semester data
  const semesterMap = {};
  courseSemesters.forEach(item => {
    const [courseId, semester] = item.split(':');
    if (courseId && semester) {
      semesterMap[courseId] = semester;
    }
  });
  
  
  // Check the appropriate courses and set semester values
  moduleCourses.forEach(courseId => {
    const checkbox = document.querySelector(`#editModuleModal .edit-course-checkbox[value="${courseId}"]`);
    if (checkbox) {
      checkbox.checked = true;
      
      // Set semester value if available
      const semesterInput = document.querySelector(`#editModuleModal input[name="semester_for_${courseId}"]`);
      if (semesterInput && semesterMap[courseId]) {
        semesterInput.value = semesterMap[courseId];
      }
      
      // Validate semester field
      validateSemesterField(checkbox);
    }
  });
  
  // Clear and initialize certificate groups
  const editContainer = document.getElementById('edit-certificate-groups');
  if (editContainer) {
    editContainer.innerHTML = '';
    groupCounter = 0; // Reset counter
    
    // Load existing certificate groups from group structure or fallback to legacy
    if (groupStructure.groups && groupStructure.groups.length > 0) {
      // Load from saved group structure
      
      // Create all needed groups first
      for (let i = 0; i < groupStructure.groups.length; i++) {
        if (typeof addCertificateGroup === 'function') {
          addCertificateGroup('edit');
        }
      }
      
      setTimeout(() => {
        
        // Load options into each group
        groupStructure.groups.forEach((group, index) => {
          const groupNumber = index + 1;
          const groupId = `edit-group-${groupNumber}`;
          
          // Set group operator
          const operatorRadios = document.querySelectorAll(`input[name="group_${groupNumber}_operator"]`);
          operatorRadios.forEach(radio => {
            radio.checked = (radio.value === group.internal_operator);
          });
          
          // Load options for this group
          group.options.forEach(optionId => {
            const dropdown = document.getElementById(`${groupId}-dropdown`);
            if (dropdown) {
              const optionElement = dropdown.querySelector(`[data-option-id="${optionId}"]`);
              if (optionElement) {
                const optionName = optionElement.getAttribute('data-option-name');
                if (typeof selectOption === 'function') {
                  selectOption(groupId, optionId, optionName);
                }
              }
            }
          });
        });
      }, 250);
    } else if (certificateOptions.length > 0) {
      // Fallback to legacy loading into single group
      setTimeout(() => {
        certificateOptions.forEach(optionId => {
          const dropdown = document.getElementById('edit-group-1-dropdown');
          if (dropdown) {
            const optionElement = dropdown.querySelector(`[data-option-id="${optionId}"]`);
            if (optionElement) {
              const optionName = optionElement.getAttribute('data-option-name');
              if (typeof selectOption === 'function') {
                selectOption('edit-group-1', optionId, optionName);
              }
            }
          }
        });
      }, 500);
    } else {
      // No saved groups, add one empty group
      if (typeof addCertificateGroup === 'function') {
        addCertificateGroup('edit');
      }
    }
  }
  
  document.getElementById('editModuleModal').classList.remove('hidden');
  setupEditCourseSearch();
  
  // Apply default filter to show only "Meine Kurse"
  filterEditCourses();
  
  updateEditSelectedCoursesCount();
}

function closeEditModuleModal() {
  document.getElementById('editModuleModal').classList.add('hidden');
  resetEditCourseSelection();
  
  // Clear certificate groups
  const container = document.getElementById('edit-certificate-groups');
  if (container) {
    container.innerHTML = '';
  }
}

// Course search and filter functionality for create modal
function setupCourseSearch() {
  const searchInput = document.getElementById('courseSearch');
  const typeFilter = document.getElementById('courseTypeFilter');
  const courseFilterRadios = document.querySelectorAll('input[name="courseFilter"]');
  
  searchInput.addEventListener('input', filterCourses);
  typeFilter.addEventListener('change', filterCourses);
  courseFilterRadios.forEach(radio => {
    radio.addEventListener('change', filterCourses);
  });
  
  // Setup course selection tracking
  document.querySelectorAll('.course-checkbox').forEach(checkbox => {
    checkbox.addEventListener('change', updateSelectedCoursesCount);
  });
  
  updateSelectedCoursesCount();
}

function filterCourses() {
  const searchTerm = document.getElementById('courseSearch').value.toLowerCase();
  const selectedType = document.getElementById('courseTypeFilter').value;
  const courseFilter = document.querySelector('input[name="courseFilter"]:checked').value;
  const courseItems = document.querySelectorAll('.course-item');
  let visibleCount = 0;
  
  courseItems.forEach(item => {
    const courseName = item.getAttribute('data-course-name');
    const courseType = item.getAttribute('data-course-type');
    const isSharedAttr = item.getAttribute('data-course-shared');
    const isShared = isSharedAttr === 'true' || isSharedAttr === 'True';
    
    const matchesSearch = courseName.includes(searchTerm);
    const matchesType = !selectedType || courseType === selectedType;
    const matchesShared = (courseFilter === 'shared') ? isShared : !isShared;
    
    if (matchesSearch && matchesType && matchesShared) {
      item.style.display = 'flex';
      visibleCount++;
    } else {
      item.style.display = 'none';
    }
  });
  
  // Show/hide "no results" message
  const noResults = document.getElementById('noCourseResults');
  if (visibleCount === 0) {
    noResults.classList.remove('hidden');
  } else {
    noResults.classList.add('hidden');
  }
}

function clearCourseFilters() {
  document.getElementById('courseSearch').value = '';
  document.getElementById('courseTypeFilter').value = '';
  document.querySelector('input[name="courseFilter"][value="my"]').checked = true;
  filterCourses();
}

function updateSelectedCoursesCount() {
  const checkboxes = document.querySelectorAll('.course-checkbox:checked');
  const count = checkboxes.length;
  let totalECTS = 0;
  let totalSWS = 0;
  
  checkboxes.forEach(checkbox => {
    const item = checkbox.closest('.course-item');
    totalECTS += parseInt(item.getAttribute('data-course-ects')) || 0;
    totalSWS += parseInt(item.getAttribute('data-course-sws')) || 0;
  });
  
  const countElement = document.getElementById('selectedCoursesCount');
  if (count > 0) {
    document.getElementById('selectedCount').textContent = count;
    document.getElementById('selectedECTS').textContent = totalECTS;
    document.getElementById('selectedSWS').textContent = totalSWS;
    countElement.classList.remove('hidden');
  } else {
    countElement.classList.add('hidden');
  }
}

function resetCourseSelection() {
  document.querySelectorAll('.course-checkbox').forEach(checkbox => {
    checkbox.checked = false;
  });
  clearCourseFilters();
  updateSelectedCoursesCount();
}

// Student count update function
function updateStudentCount(input) {
  // Prevent updates if inputs are disabled (safety check)
  if (input.disabled) {
    return;
  }
  
  // Only update immediately if not in edit mode (for backward compatibility)
  if (!isEditMode) {
    const programmeId = input.dataset.programmeId;
    const semester = input.dataset.semester;
    const type = input.dataset.type;  // 'min' or 'max'
    const value = input.value;

    // Prepare form data
    const formData = new FormData();
    formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    formData.append('action', 'update_student_count');
    formData.append('programme_id', programmeId);
    formData.append('semester', semester);
    formData.append('type', type);
    formData.append('value', value);

    // Send AJAX request
    fetch(window.location.pathname, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        // Add visual feedback for successful save
        input.classList.add('bg-green-50');
        setTimeout(() => {
          input.classList.remove('bg-green-50');
        }, 1000);
      } else {
        console.error('Failed to update student count:', data.message || 'Unknown error');
        // Add visual feedback for error
        input.classList.add('bg-red-50');
        setTimeout(() => {
          input.classList.remove('bg-red-50');
        }, 2000);
      }
    })
    .catch(error => {
      console.error('Error updating student count:', error);
      // Add visual feedback for error
      input.classList.add('bg-red-50');
      setTimeout(() => {
        input.classList.remove('bg-red-50');
      }, 2000);
    });
  }
  // In edit mode, changes are batched and saved when "Save" is clicked
}

// Batch update function for edit mode
function batchUpdateNebenfach(input) {
  return new Promise((resolve, reject) => {
    const programmeId = input.dataset.programmeId;
    const semester = input.dataset.semester;
    const value = input.value;

    // Prepare form data
    const formData = new FormData();
    formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    formData.append('action', 'update_nebenfach');
    formData.append('programme_id', programmeId);
    formData.append('semester', semester);
    formData.append('value', value);

    // Send AJAX request
    fetch(window.location.pathname, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        resolve();
      } else {
        reject(data.message || 'Unknown error');
      }
    })
    .catch(error => {
      reject(error);
    });
  });
}

// Edit mode functionality
let isEditMode = false;
let originalValues = {};

// Initialize edit mode state on page load
function initializeEditMode() {
  const editBtn = document.getElementById('edit-table-btn');
  const saveBtn = document.getElementById('save-changes-btn');
  const discardBtn = document.getElementById('discard-changes-btn');
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');
  
  // Ensure we start in non-edit mode
  isEditMode = false;
  originalValues = {};
  
  // Reset button states
  if (editBtn) {
    editBtn.classList.remove('hidden');
    editBtn.disabled = false;
  }
  if (saveBtn) {
    saveBtn.classList.add('hidden');
    saveBtn.disabled = false;
  }
  if (discardBtn) {
    discardBtn.classList.add('hidden');
    discardBtn.disabled = false;
  }
  
  // Ensure all inputs are disabled initially and remove any edit styling
  studentInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
    input.classList.remove('bg-green-50');
    input.classList.remove('bg-red-50');
  });
  nebenfachInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
    input.classList.remove('bg-green-50');
    input.classList.remove('bg-red-50');
  });
  
}

function toggleEditMode() {
  
  const editBtn = document.getElementById('edit-table-btn');
  const saveBtn = document.getElementById('save-changes-btn');
  const discardBtn = document.getElementById('discard-changes-btn');
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');

  // Prevent double-clicking issues
  if (editBtn && editBtn.disabled) {
    return;
  }

  if (!isEditMode) {
    // Enter edit mode
    isEditMode = true;
    
    // Store original values
    originalValues = {};
    studentInputs.forEach(input => {
      const key = `${input.dataset.semester}-${input.dataset.type}`;
      originalValues[key] = input.value;
    });
    nebenfachInputs.forEach(input => {
      const key = `nebenfach-${input.dataset.semester}`;
      originalValues[key] = input.value;
    });
    
    // Enable inputs
    studentInputs.forEach(input => input.disabled = false);
    nebenfachInputs.forEach(input => input.disabled = false);
    
    // Update button states
    editBtn.classList.add('hidden');
    saveBtn.classList.remove('hidden');
    discardBtn.classList.remove('hidden');
    
    // Add visual indicator (subtle background change instead of borders)
    studentInputs.forEach(input => input.classList.add('bg-blue-50'));
    nebenfachInputs.forEach(input => input.classList.add('bg-blue-50'));
  }
}

async function saveChanges() {
  // Remember the state of the details fold
  const detailsView = document.getElementById('detailed-view');
  const wasDetailsOpen = !detailsView.classList.contains('hidden');
  
  // Store the state in sessionStorage to preserve it across reload
  if (wasDetailsOpen) {
    sessionStorage.setItem('detailsViewOpen', 'true');
  } else {
    sessionStorage.removeItem('detailsViewOpen');
  }
  
  // Collect all modified inputs
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');
  
  const updates = [];
  
  // Check for modified student count inputs
  studentInputs.forEach(input => {
    const key = `${input.dataset.semester}-${input.dataset.type}`;
    if (originalValues[key] !== input.value) {
      updates.push(batchUpdateStudentCount(input));
    }
  });
  
  // Check for modified nebenfach inputs
  nebenfachInputs.forEach(input => {
    const key = `nebenfach-${input.dataset.semester}`;
    if (originalValues[key] !== input.value) {
      updates.push(batchUpdateNebenfach(input));
    }
  });
  
  // If no changes, just exit edit mode
  if (updates.length === 0) {
    exitEditMode();
    return;
  }
  
  // Disable save button to prevent double-saves
  const saveBtn = document.getElementById('save-changes-btn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 714 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
  saveBtn.title = 'Speichere...';
  
  try {
    // Execute all updates in parallel
    await Promise.all(updates);
    
    // Show success feedback
    saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
    saveBtn.title = 'Gespeichert!';
    saveBtn.classList.remove('text-green-600', 'hover:text-green-700', 'hover:bg-green-50');
    saveBtn.classList.add('text-green-700', 'bg-green-100');
    
    // Wait a moment then reload to show updated totals
    setTimeout(() => {
      window.location.reload();
    }, 800);
    
  } catch (error) {
    console.error('Error saving changes:', error);
    saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
    saveBtn.title = 'Fehler beim Speichern';
    saveBtn.classList.remove('text-green-600', 'hover:text-green-700', 'hover:bg-green-50');
    saveBtn.classList.add('text-red-600', 'hover:text-red-700', 'hover:bg-red-50');
    saveBtn.disabled = false;
    
    // Reset button after error
    setTimeout(() => {
      saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
      saveBtn.title = 'Speichern';
      saveBtn.classList.remove('text-red-600', 'hover:text-red-700', 'hover:bg-red-50');
      saveBtn.classList.add('text-green-600', 'hover:text-green-700', 'hover:bg-green-50');
    }, 2000);
  }
}

function discardChanges() {
  // Restore original values
  document.querySelectorAll('.student-count-input').forEach(input => {
    const key = `${input.dataset.semester}-${input.dataset.type}`;
    input.value = originalValues[key] || '';
  });
  
  document.querySelectorAll('.nebenfach-input').forEach(input => {
    const key = `nebenfach-${input.dataset.semester}`;
    input.value = originalValues[key] || '';
  });
  
  exitEditMode();
}

function exitEditMode() {
  isEditMode = false;
  originalValues = {}; // Clear stored values
  
  const editBtn = document.getElementById('edit-table-btn');
  const saveBtn = document.getElementById('save-changes-btn');
  const discardBtn = document.getElementById('discard-changes-btn');
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');
  
  // Disable inputs
  studentInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
  });
  nebenfachInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
  });
  
  // Update button states
  if (editBtn) {
    editBtn.classList.remove('hidden');
    editBtn.disabled = false;
  }
  if (saveBtn) {
    saveBtn.classList.add('hidden');
    saveBtn.disabled = false;
    // Reset save button to original state
    saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
    saveBtn.title = 'Speichern';
    saveBtn.className = 'hidden inline-flex items-center justify-center w-8 h-8 text-green-600 hover:text-green-700 hover:bg-green-50 rounded-md transition-colors duration-200';
  }
  if (discardBtn) {
    discardBtn.classList.add('hidden');
    discardBtn.disabled = false;
  }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  // Initialize edit mode state
  initializeEditMode();
  
  // Restore details view state after page load
  const shouldOpenDetails = sessionStorage.getItem('detailsViewOpen');
  if (shouldOpenDetails === 'true') {
    const detailsView = document.getElementById('detailed-view');
    const chevron = document.getElementById('detailed-view-chevron');

      detailsView.classList.remove('hidden');

        chevron.style.transform = 'rotate(180deg)';
      }
    }
    // Clear the flag after restoring
    sessionStorage.removeItem('detailsViewOpen');
  }
});

// Searchable Certificate Select Functions
let selectedCertificateOptions = {
  create: {},
  edit: {}
};

function focusSearchInput(inputId) {
  document.getElementById(inputId).focus();
}

function showCertificateDropdown(mode) {
  const dropdown = document.getElementById(`${mode}-cert-dropdown`);
  dropdown.classList.remove('hidden');
}

function hideCertificateDropdown(mode) {
  setTimeout(() => {
    const dropdown = document.getElementById(`${mode}-cert-dropdown`);
    dropdown.classList.add('hidden');
  }, 150);
}

function filterCertificateOptions(mode, searchTerm) {
  const dropdown = document.getElementById(`${mode}-cert-dropdown`);
  const options = dropdown.querySelectorAll('.certificate-option');
  
  options.forEach(option => {
    const optionName = option.getAttribute('data-option-name').toLowerCase();
    const optionId = option.getAttribute('data-option-id');
    
    if (optionName.includes(searchTerm.toLowerCase()) && !selectedCertificateOptions[mode][optionId]) {
      option.style.display = 'block';
    } else {
      option.style.display = 'none';
    }
  });
}

function selectCertificateOption(mode, optionId, optionName) {
  if (selectedCertificateOptions[mode][optionId]) {
    return; // Already selected
  }
  
  // Add to selected options
  selectedCertificateOptions[mode][optionId] = optionName;
  
  // Create tag element
  const tag = document.createElement('div');
  tag.className = 'selected-option-tag inline-flex items-center px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded-full';
  tag.innerHTML = `
    <span>${optionName}</span>
    <button type="button" class="ml-1 text-blue-600 hover:text-blue-800" onclick="removeCertificateOption('${mode}', ${optionId})">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  `;
  
  // Add to selected options container
  document.getElementById(`${mode}-selected-options`).appendChild(tag);
  
  // Update hidden inputs
  updateCertificateHiddenInputs(mode);
  
  // Clear search
  document.getElementById(`${mode}-cert-search`).value = '';
  
  // Hide dropdown
  hideCertificateDropdown(mode);
  
  // Update filter
  filterCertificateOptions(mode, '');
}

function removeCertificateOption(mode, optionId) {
  // Remove from selected options
  delete selectedCertificateOptions[mode][optionId];
  
  // Remove tag element
  const container = document.getElementById(`${mode}-selected-options`);
  const tags = container.querySelectorAll('.selected-option-tag');
  tags.forEach(tag => {
    const button = tag.querySelector('button');
    if (button && button.getAttribute('onclick').includes(optionId)) {
      tag.remove();
    }
  });
  
  // Update hidden inputs
  updateCertificateHiddenInputs(mode);
  
  // Update filter
  filterCertificateOptions(mode, document.getElementById(`${mode}-cert-search`).value);
}

function updateCertificateHiddenInputs(mode) {
  const container = document.getElementById(`${mode}-cert-hidden-inputs`);
  container.innerHTML = '';
  
  Object.keys(selectedCertificateOptions[mode]).forEach(optionId => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'certificate_options';
    input.value = optionId;
    container.appendChild(input);
  });
}

function clearSelectedCertificateOptions(mode) {
  selectedCertificateOptions[mode] = {};
  
  // Check if elements exist before accessing them (for backwards compatibility)
  const selectedOptionsEl = document.getElementById(`${mode}-selected-options`);
  if (selectedOptionsEl) {
    selectedOptionsEl.innerHTML = '';
  }
  
  const hiddenInputsEl = document.getElementById(`${mode}-cert-hidden-inputs`);
  if (hiddenInputsEl) {
    hiddenInputsEl.innerHTML = '';
  }
}

function loadSelectedCertificateOptions(mode, optionIds) {
  clearSelectedCertificateOptions(mode);
  
  optionIds.forEach(optionId => {
    const dropdown = document.getElementById(`${mode}-cert-dropdown`);
    const option = dropdown.querySelector(`[data-option-id="${optionId}"]`);
    if (option) {
      const optionName = option.getAttribute('data-option-name');
      selectCertificateOption(mode, optionId, optionName);
    }
  });
}

function handleCertificateKeydown(event, mode) {
  if (event.key === 'Escape') {
    hideCertificateDropdown(mode);
  }
}

// Validation for semester fields when course is selected
function validateSemesterField(courseCheckbox) {
  const courseId = courseCheckbox.value;
  const semesterInput = document.querySelector(`input[name="semester_for_${courseId}"]`);
  
  // Check if semester input exists (it should exist in both create and edit modals)
  if (!semesterInput) {
    return;
  }
  
  if (courseCheckbox.checked) {
    // Course is selected, semester is required
    semesterInput.setAttribute('required', 'required');
    semesterInput.style.borderColor = '#d1d5db'; // Reset border color
    
    // If empty, highlight as required
    if (!semesterInput.value) {
      semesterInput.style.borderColor = '#ef4444'; // Red border
      semesterInput.setAttribute('title', 'Semester ist erforderlich für ausgewählte Kurse');
    }
  } else {
    // Course is not selected, semester is not required
    semesterInput.removeAttribute('required');
    semesterInput.style.borderColor = '#d1d5db'; // Reset border color
    semesterInput.removeAttribute('title');
  }
}

// Validate all semester fields on form submission
function validateModuleForm(form) {
  const checkedCourses = form.querySelectorAll('input[name="module_courses"]:checked');
  let isValid = true;
  let firstInvalidField = null;
  
  checkedCourses.forEach(courseCheckbox => {
    const courseId = courseCheckbox.value;
    const semesterInput = form.querySelector(`input[name="semester_for_${courseId}"]`);
    
    // Skip if semester input doesn't exist
    if (!semesterInput) {
      return;
    }
    
    if (!semesterInput.value || semesterInput.value < 1) {
      isValid = false;
      semesterInput.style.borderColor = '#ef4444'; // Red border
      semesterInput.setAttribute('title', 'Semester ist erforderlich für ausgewählte Kurse');
      
      // Remember first invalid field
      if (!firstInvalidField) {
        firstInvalidField = semesterInput;
      }
    } else {
      semesterInput.style.borderColor = '#d1d5db'; // Reset border color
      semesterInput.removeAttribute('title');
    }
  });
  
  // Collect certificate groups data and convert to old format for backend compatibility
  if (isValid) {
    collectAndSubmitCertificateData(form);
  }
  
  if (!isValid) {
    alert('Bitte geben Sie ein gültiges Semester für alle ausgewählten Kurse an.');
    // Focus on first invalid field
    if (firstInvalidField) {
      firstInvalidField.focus();
    }
  }
  
  return isValid;
}

function collectAndSubmitCertificateData(form) {
  // Remove any existing certificate data inputs to avoid duplicates (but keep the original checkbox and radio buttons)
  form.querySelectorAll('input[name^="certificate_"]').forEach(input => input.remove());
  form.querySelectorAll('input[name^="group_"][type="hidden"]').forEach(input => input.remove()); // Only remove hidden inputs, not radio buttons
  form.querySelectorAll('input[name="logic_operator"]').forEach(input => input.remove());
  form.querySelectorAll('input[name="is_graded"][type="hidden"]').forEach(input => input.remove());
  
  // Determine modal type based on form action
  const action = form.querySelector('input[name="action"]').value;
  const modalType = action === 'edit_module' ? 'edit' : 'create';
  
  
  // Collect certificate groups data
  const container = document.getElementById(`${modalType}-certificate-groups`);
  let groupCount = 0;
  
  if (container) {
    const groups = container.querySelectorAll('.certificate-group');
    
    groups.forEach((group, groupIndex) => {
      const groupId = group.id.replace(`${modalType}-group-`, '');
      const selectedWrapper = group.querySelector(`#${modalType}-group-${groupId}-selected`);
      
      const operatorRadios = group.querySelectorAll(`input[name="group_${groupId}_operator"]`);
      
      // Get selected options for this group
      const groupOptions = [];
      
      if (selectedWrapper) {
        const selectedOptions = selectedWrapper.querySelectorAll('.selected-option-tag');
        selectedOptions.forEach(option => {
          const optionId = option.getAttribute('data-option-id');
          if (optionId) {
            groupOptions.push(optionId);
          }
        });
      }
      
      // Get internal operator for this group (OR/AND within the group)
      let internalOperator = 'or';
      operatorRadios.forEach(radio => {
        if (radio.checked) {
          internalOperator = radio.value;
        }
      });
      
      // Submit all groups, even empty ones (to maintain group structure)
      groupCount++;
      
      // Add group options (if any)
      if (groupOptions.length > 0) {
        groupOptions.forEach(optionId => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = `group_${groupCount}_options`;
          input.value = optionId;
          form.appendChild(input);
        });
      }
      
      // Add group internal operator
      const operatorInput = document.createElement('input');
      operatorInput.type = 'hidden';
      operatorInput.name = `group_${groupCount}_operator`;
      operatorInput.value = internalOperator;
      form.appendChild(operatorInput);
      
    });
  }
  
  // Add group count
  const groupCountInput = document.createElement('input');
  groupCountInput.type = 'hidden';
  groupCountInput.name = 'certificate_group_count';
  groupCountInput.value = groupCount;
  form.appendChild(groupCountInput);
  
  // Add global operator from combinator radios
  let globalOperator = 'and'; // default
  const combinatorRadios = form.querySelectorAll('input[name^="combinator_"]:checked');
  if (combinatorRadios.length > 0) {
    // Use the first combinator as the global operator
    globalOperator = combinatorRadios[0].value;
  }
  
  const globalOperatorInput = document.createElement('input');
  globalOperatorInput.type = 'hidden';
  globalOperatorInput.name = 'global_operator';
  globalOperatorInput.value = globalOperator;
  form.appendChild(globalOperatorInput);
  
  // Add certificate comment
  const commentField = document.getElementById(`${modalType}_certificate_comment`);
  const commentInput = document.createElement('input');
  commentInput.type = 'hidden';
  commentInput.name = 'certificate_comment';
  commentInput.value = commentField ? commentField.value : '';
  form.appendChild(commentInput);
  
  // Add is_graded
  const gradedFieldId = `${modalType}_is_graded`;
  const gradedField = document.getElementById(gradedFieldId);
  
  // Also try to find it by name as backup
  const gradedFieldByName = form.querySelector('input[name="is_graded"]');
  
  const finalGradedField = gradedField || gradedFieldByName;
  
  const gradedInput = document.createElement('input');
  gradedInput.type = 'hidden';
  gradedInput.name = 'is_graded';
  gradedInput.value = (finalGradedField && finalGradedField.checked) ? 'on' : '';
  form.appendChild(gradedInput);
  
}

// Add event listener for semester input changes
document.addEventListener('DOMContentLoaded', function() {
  // Add validation to semester inputs
  document.querySelectorAll('.semester-input').forEach(input => {
    input.addEventListener('input', function() {
      const courseId = this.dataset.courseId;
      const courseCheckbox = document.querySelector(`input[name="module_courses"][value="${courseId}"]`);
      
      if (courseCheckbox && courseCheckbox.checked) {
        if (this.value && this.value >= 1) {
          this.style.borderColor = '#d1d5db'; // Reset border color
          this.removeAttribute('title');
        } else {
          this.style.borderColor = '#ef4444'; // Red border
          this.setAttribute('title', 'Semester ist erforderlich für ausgewählte Kurse');
        }
      }
    });
  });
});
