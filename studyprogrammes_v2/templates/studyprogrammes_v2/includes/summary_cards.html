{% load v2_extras %}
<!-- Basic Information Pills - All in One Row -->
<div class="flex justify-center lg:justify-start">
  <div class="grid grid-cols-3 gap-3">
    <!-- Module Pill -->
    <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 shadow-sm hover:shadow-md transition-shadow">
      <div class="flex justify-center items-center space-x-2">
        <div class="text-2xl font-bold text-blue-700">{{ programme_modules.count }}</div>
        <div class="text-sm font-medium text-blue-600">Module</div>
      </div>
    </div>
    
    <!-- ECTS Pill -->
    <div class="bg-green-50 border border-green-200 rounded-xl p-3 shadow-sm hover:shadow-md transition-shadow">
      <div class="flex justify-center items-center space-x-2">
        <div class="text-2xl font-bold text-green-700">{{ programme.total_ects }}</div>
        <div class="text-sm font-medium text-green-600">ECTS</div>
      </div>
    </div>
    
    <!-- SWS Pill -->
    <div class="bg-purple-50 border border-purple-200 rounded-xl p-3 shadow-sm hover:shadow-md transition-shadow">
      <div class="flex justify-center items-center space-x-2">
        <div class="text-2xl font-bold text-purple-700">{{ programme|programme_sws_range_total:student_counts }}</div>
        <div class="text-sm font-medium text-purple-600">SWS</div>
      </div>
    </div>
  </div>
</div>
