<!-- JavaScript Functions -->
<script>
// Detailed view toggle functionality  
function toggleDetailedView() {
  const content = document.getElementById('detailed-view');
  const chevron = document.getElementById('detailed-view-chevron');
  
  if (content.classList.contains('hidden')) {
    content.classList.remove('hidden');
    chevron.style.transform = 'rotate(180deg)';
  } else {
    content.classList.add('hidden');
    chevron.style.transform = 'rotate(0deg)';
  }
}

// Module tray toggle functionality
function toggleModuleTray(moduleId) {
  const tray = document.getElementById(`module-tray-${moduleId}`);
  const chevron = document.querySelector(`.module-chevron-${moduleId}`);
  
  if (tray.classList.contains('hidden')) {
    tray.classList.remove('hidden');
    chevron.style.transform = 'rotate(180deg)';
  } else {
    tray.classList.add('hidden');
    chevron.style.transform = 'rotate(0deg)';
  }
}

function openCreateModuleModal() {
  document.getElementById('createModuleModal').classList.remove('hidden');
  setupCourseSearch();
}

function closeCreateModuleModal() {
  document.getElementById('createModuleModal').classList.add('hidden');
  resetCourseSelection();
}

function openEditModuleModal(moduleId) {
  const button = document.querySelector(`.edit-module-btn[data-module-id="${moduleId}"]`);
  const moduleName = button.getAttribute('data-module-name');
  const moduleDescription = button.getAttribute('data-module-description');
  const moduleCertificate = button.getAttribute('data-module-certificate');
  const moduleCourses = button.getAttribute('data-module-courses').split(',').filter(id => id !== '');
  
  // Populate the form
  document.getElementById('edit_module_id').value = moduleId;
  document.getElementById('edit_module_name').value = moduleName;
  document.getElementById('edit_module_description').value = moduleDescription;
  document.getElementById('edit_module_certificate').value = moduleCertificate || '';
  
  // Clear all checkboxes first
  document.querySelectorAll('.edit-course-checkbox').forEach(checkbox => {
    checkbox.checked = false;
  });
  
  // Check the appropriate courses
  moduleCourses.forEach(courseId => {
    const checkbox = document.querySelector(`.edit-course-checkbox[value="${courseId}"]`);
    if (checkbox) {
      checkbox.checked = true;
    }
  });
  
  document.getElementById('editModuleModal').classList.remove('hidden');
  setupEditCourseSearch();
  updateEditSelectedCoursesCount();
}

function closeEditModuleModal() {
  document.getElementById('editModuleModal').classList.add('hidden');
  resetEditCourseSelection();
}

// Course search and filter functionality for create modal
function setupCourseSearch() {
  const searchInput = document.getElementById('courseSearch');
  const typeFilter = document.getElementById('courseTypeFilter');
  
  searchInput.addEventListener('input', filterCourses);
  typeFilter.addEventListener('change', filterCourses);
  
  // Setup course selection tracking
  document.querySelectorAll('.course-checkbox').forEach(checkbox => {
    checkbox.addEventListener('change', updateSelectedCoursesCount);
  });
  
  updateSelectedCoursesCount();
}

function filterCourses() {
  const searchTerm = document.getElementById('courseSearch').value.toLowerCase();
  const selectedType = document.getElementById('courseTypeFilter').value;
  const courseItems = document.querySelectorAll('.course-item');
  let visibleCount = 0;
  
  courseItems.forEach(item => {
    const courseName = item.getAttribute('data-course-name');
    const courseType = item.getAttribute('data-course-type');
    
    const matchesSearch = courseName.includes(searchTerm);
    const matchesType = !selectedType || courseType === selectedType;
    
    if (matchesSearch && matchesType) {
      item.style.display = 'flex';
      visibleCount++;
    } else {
      item.style.display = 'none';
    }
  });
  
  // Show/hide "no results" message
  const noResults = document.getElementById('noCourseResults');
  if (visibleCount === 0) {
    noResults.classList.remove('hidden');
  } else {
    noResults.classList.add('hidden');
  }
}

function clearCourseFilters() {
  document.getElementById('courseSearch').value = '';
  document.getElementById('courseTypeFilter').value = '';
  filterCourses();
}

function updateSelectedCoursesCount() {
  const checkboxes = document.querySelectorAll('.course-checkbox:checked');
  const count = checkboxes.length;
  let totalECTS = 0;
  let totalSWS = 0;
  
  checkboxes.forEach(checkbox => {
    const item = checkbox.closest('.course-item');
    totalECTS += parseInt(item.getAttribute('data-course-ects')) || 0;
    totalSWS += parseInt(item.getAttribute('data-course-sws')) || 0;
  });
  
  const countElement = document.getElementById('selectedCoursesCount');
  if (count > 0) {
    document.getElementById('selectedCount').textContent = count;
    document.getElementById('selectedECTS').textContent = totalECTS;
    document.getElementById('selectedSWS').textContent = totalSWS;
    countElement.classList.remove('hidden');
  } else {
    countElement.classList.add('hidden');
  }
}

function resetCourseSelection() {
  document.querySelectorAll('.course-checkbox').forEach(checkbox => {
    checkbox.checked = false;
  });
  clearCourseFilters();
  updateSelectedCoursesCount();
}

// Student count update function
function updateStudentCount(input) {
  // Prevent updates if inputs are disabled (safety check)
  if (input.disabled) {
    console.log('Input is disabled, ignoring update');
    return;
  }
  
  // Only update immediately if not in edit mode (for backward compatibility)
  if (!isEditMode) {
    console.log('Updating student count immediately (not in edit mode)');
    const programmeId = input.dataset.programmeId;
    const semester = input.dataset.semester;
    const type = input.dataset.type;  // 'min' or 'max'
    const value = input.value;

    // Prepare form data
    const formData = new FormData();
    formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    formData.append('action', 'update_student_count');
    formData.append('programme_id', programmeId);
    formData.append('semester', semester);
    formData.append('type', type);
    formData.append('value', value);

    // Send AJAX request
    fetch(window.location.pathname, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        // Add visual feedback for successful save
        input.classList.add('bg-green-50');
        setTimeout(() => {
          input.classList.remove('bg-green-50');
        }, 1000);
      } else {
        console.error('Failed to update student count:', data.message || 'Unknown error');
        // Add visual feedback for error
        input.classList.add('bg-red-50');
        setTimeout(() => {
          input.classList.remove('bg-red-50');
        }, 2000);
      }
    })
    .catch(error => {
      console.error('Error updating student count:', error);
      // Add visual feedback for error
      input.classList.add('bg-red-50');
      setTimeout(() => {
        input.classList.remove('bg-red-50');
      }, 2000);
    });
  }
  // In edit mode, changes are batched and saved when "Save" is clicked
}

// Batch update function for edit mode
function batchUpdateNebenfach(input) {
  return new Promise((resolve, reject) => {
    const programmeId = input.dataset.programmeId;
    const semester = input.dataset.semester;
    const value = input.value;

    // Prepare form data
    const formData = new FormData();
    formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    formData.append('action', 'update_nebenfach');
    formData.append('programme_id', programmeId);
    formData.append('semester', semester);
    formData.append('value', value);

    // Send AJAX request
    fetch(window.location.pathname, {
      method: 'POST',
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        resolve();
      } else {
        reject(data.message || 'Unknown error');
      }
    })
    .catch(error => {
      reject(error);
    });
  });
}

// Edit mode functionality
let isEditMode = false;
let originalValues = {};

// Initialize edit mode state on page load
function initializeEditMode() {
  const editBtn = document.getElementById('edit-table-btn');
  const saveBtn = document.getElementById('save-changes-btn');
  const discardBtn = document.getElementById('discard-changes-btn');
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');
  
  // Ensure we start in non-edit mode
  isEditMode = false;
  originalValues = {};
  
  // Reset button states
  if (editBtn) {
    editBtn.classList.remove('hidden');
    editBtn.disabled = false;
  }
  if (saveBtn) {
    saveBtn.classList.add('hidden');
    saveBtn.disabled = false;
  }
  if (discardBtn) {
    discardBtn.classList.add('hidden');
    discardBtn.disabled = false;
  }
  
  // Ensure all inputs are disabled initially and remove any edit styling
  studentInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
    input.classList.remove('bg-green-50');
    input.classList.remove('bg-red-50');
  });
  nebenfachInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
    input.classList.remove('bg-green-50');
    input.classList.remove('bg-red-50');
  });
  
  console.log('Edit mode initialized - isEditMode:', isEditMode);
}

function toggleEditMode() {
  console.log('toggleEditMode called, current isEditMode:', isEditMode);
  
  const editBtn = document.getElementById('edit-table-btn');
  const saveBtn = document.getElementById('save-changes-btn');
  const discardBtn = document.getElementById('discard-changes-btn');
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');

  // Prevent double-clicking issues
  if (editBtn && editBtn.disabled) {
    console.log('Edit button is disabled, preventing toggle');
    return;
  }

  if (!isEditMode) {
    // Enter edit mode
    isEditMode = true;
    console.log('Entering edit mode');
    
    // Store original values
    originalValues = {};
    studentInputs.forEach(input => {
      const key = `${input.dataset.semester}-${input.dataset.type}`;
      originalValues[key] = input.value;
    });
    nebenfachInputs.forEach(input => {
      const key = `nebenfach-${input.dataset.semester}`;
      originalValues[key] = input.value;
    });
    
    // Enable inputs
    studentInputs.forEach(input => input.disabled = false);
    nebenfachInputs.forEach(input => input.disabled = false);
    
    // Update button states
    editBtn.classList.add('hidden');
    saveBtn.classList.remove('hidden');
    discardBtn.classList.remove('hidden');
    
    // Add visual indicator (subtle background change instead of borders)
    studentInputs.forEach(input => input.classList.add('bg-blue-50'));
    nebenfachInputs.forEach(input => input.classList.add('bg-blue-50'));
  }
}

async function saveChanges() {
  // Remember the state of the details fold
  const detailsView = document.getElementById('detailed-view');
  const wasDetailsOpen = !detailsView.classList.contains('hidden');
  
  // Store the state in sessionStorage to preserve it across reload
  if (wasDetailsOpen) {
    sessionStorage.setItem('detailsViewOpen', 'true');
  } else {
    sessionStorage.removeItem('detailsViewOpen');
  }
  
  // Collect all modified inputs
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');
  
  const updates = [];
  
  // Check for modified student count inputs
  studentInputs.forEach(input => {
    const key = `${input.dataset.semester}-${input.dataset.type}`;
    if (originalValues[key] !== input.value) {
      updates.push(batchUpdateStudentCount(input));
    }
  });
  
  // Check for modified nebenfach inputs
  nebenfachInputs.forEach(input => {
    const key = `nebenfach-${input.dataset.semester}`;
    if (originalValues[key] !== input.value) {
      updates.push(batchUpdateNebenfach(input));
    }
  });
  
  // If no changes, just exit edit mode
  if (updates.length === 0) {
    exitEditMode();
    return;
  }
  
  // Disable save button to prevent double-saves
  const saveBtn = document.getElementById('save-changes-btn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 714 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
  saveBtn.title = 'Speichere...';
  
  try {
    // Execute all updates in parallel
    await Promise.all(updates);
    
    // Show success feedback
    saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
    saveBtn.title = 'Gespeichert!';
    saveBtn.classList.remove('text-green-600', 'hover:text-green-700', 'hover:bg-green-50');
    saveBtn.classList.add('text-green-700', 'bg-green-100');
    
    // Wait a moment then reload to show updated totals
    setTimeout(() => {
      window.location.reload();
    }, 800);
    
  } catch (error) {
    console.error('Error saving changes:', error);
    saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
    saveBtn.title = 'Fehler beim Speichern';
    saveBtn.classList.remove('text-green-600', 'hover:text-green-700', 'hover:bg-green-50');
    saveBtn.classList.add('text-red-600', 'hover:text-red-700', 'hover:bg-red-50');
    saveBtn.disabled = false;
    
    // Reset button after error
    setTimeout(() => {
      saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
      saveBtn.title = 'Speichern';
      saveBtn.classList.remove('text-red-600', 'hover:text-red-700', 'hover:bg-red-50');
      saveBtn.classList.add('text-green-600', 'hover:text-green-700', 'hover:bg-green-50');
    }, 2000);
  }
}

function discardChanges() {
  // Restore original values
  document.querySelectorAll('.student-count-input').forEach(input => {
    const key = `${input.dataset.semester}-${input.dataset.type}`;
    input.value = originalValues[key] || '';
  });
  
  document.querySelectorAll('.nebenfach-input').forEach(input => {
    const key = `nebenfach-${input.dataset.semester}`;
    input.value = originalValues[key] || '';
  });
  
  exitEditMode();
}

function exitEditMode() {
  isEditMode = false;
  originalValues = {}; // Clear stored values
  
  const editBtn = document.getElementById('edit-table-btn');
  const saveBtn = document.getElementById('save-changes-btn');
  const discardBtn = document.getElementById('discard-changes-btn');
  const studentInputs = document.querySelectorAll('.student-count-input');
  const nebenfachInputs = document.querySelectorAll('.nebenfach-input');
  
  // Disable inputs
  studentInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
  });
  nebenfachInputs.forEach(input => {
    input.disabled = true;
    input.classList.remove('bg-blue-50');
  });
  
  // Update button states
  if (editBtn) {
    editBtn.classList.remove('hidden');
    editBtn.disabled = false;
  }
  if (saveBtn) {
    saveBtn.classList.add('hidden');
    saveBtn.disabled = false;
    // Reset save button to original state
    saveBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
    saveBtn.title = 'Speichern';
    saveBtn.className = 'hidden inline-flex items-center justify-center w-8 h-8 text-green-600 hover:text-green-700 hover:bg-green-50 rounded-md transition-colors duration-200';
  }
  if (discardBtn) {
    discardBtn.classList.add('hidden');
    discardBtn.disabled = false;
  }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  // Initialize edit mode state
  initializeEditMode();
  
  // Restore details view state after page load
  const shouldOpenDetails = sessionStorage.getItem('detailsViewOpen');
  if (shouldOpenDetails === 'true') {
    const detailsView = document.getElementById('detailed-view');
    const chevron = document.getElementById('detailed-view-chevron');
    if (detailsView && detailsView.classList.contains('hidden')) {
      detailsView.classList.remove('hidden');
      if (chevron) {
        chevron.style.transform = 'rotate(180deg)';
      }
    }
    // Clear the flag after restoring
    sessionStorage.removeItem('detailsViewOpen');
  }
});
</script>
